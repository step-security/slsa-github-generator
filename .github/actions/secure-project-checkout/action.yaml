name: "secure-project-checkout"
description: "Checkout a project and verify its commit sha"

inputs:
  checkout-sha1:
    description: "The sha1 to checkout."
    required: false
    default: ""

  fetch-depth:
    # Same argument to https://github.com/actions/checkout.
    description: "Number of commits to fetch. 0 indicates all history for all branches and tags."
    required: false
    default: 1
  path:
    # Same argument to https://github.com/actions/checkout.
    description: "Relative path under $GITHUB_WORKSPACE to place the repository."
    required: true
  # The token is not available to actions by defaults, so we need to
  # share it explicitly. The token is needed to checkout private repositories.
  token:
    description: "Token used to fetch the repository."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="slsa-framework/slsa-github-generator"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - name: Checkout the repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.checkout-sha1 }}
        # Different from default actions/checkout which defaults to `true`.
        persist-credentials: false
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}

    - name: Verify commit sha
      shell: bash
      env:
        CONTEXT: "${{ toJSON(github) }}"
        CHECKOUT_SHA1: "${{ inputs.checkout-sha1 }}"
      working-directory: "${{ inputs.path }}"
      run: |
        set -euo pipefail

        git_sha="$(git log -1 --format='%H')"
        # By default, we clone at the sha indicated by the GitHub event.
        checkout_sha="$GITHUB_SHA"

        # If the user provided a sha, we use it instead.
        if [[ -n "${CHECKOUT_SHA1:-}" ]]; then
          checkout_sha="${CHECKOUT_SHA1}"
        fi

        # Verify that the sha is correctly formatted.
        regex="^[a-fA-F0-9]{40}$"
        if [[ ! "$checkout_sha" =~ $regex ]]; then
            echo "invalid sha: $checkout_sha"
            exit 1
        fi

        # Note: For pull requests, the `$GITHUB_SHA` corresponds to the
        # merge commit that GitHub automatically creates.
        # It is consistent with what the checkout Actions pulls.
        # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows.

        if [[ "$git_sha" != "$checkout_sha" ]]; then
            echo "mismatch git sha \"$git_sha\" != \"$checkout_sha\""
            echo "GitHub context:"
            echo "$CONTEXT"
            echo
            echo "Last 20 commits:"
            git log -20
            exit 1
        fi
