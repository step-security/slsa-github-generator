name: NPM Audit Fix Run

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Use --force flag for npm audit fix?"
        required: true
        type: boolean
      base_branch:
        description: "Specify a base branch"
        required: false
        default: "main"
      node_version:
        description: "Node.js version to use"
        required: false
        default: "24"
      working_directories:
        description: "Comma-separated list of working directories to run audit fix in"
        required: false
        default: ".github/actions/compute-sha256,.github/actions/create-container_based-predicate,.github/actions/detect-workflow-js,.github/actions/generate-attestations,.github/actions/privacy-check,.github/actions/sign-attestations,.github/actions/verify-token"
      script:
        description: "Build script to run after audit fix"
        required: false
        default: "npm run all"
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pull-requests: write
  packages: read
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.set-matrix.outputs.directories }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Build directory matrix
        id: set-matrix
        run: |
          INPUT="${{ inputs.working_directories || '.github/actions/compute-sha256,.github/actions/create-container_based-predicate,.github/actions/detect-workflow-js,.github/actions/generate-attestations,.github/actions/privacy-check,.github/actions/sign-attestations,.github/actions/verify-token' }}"
          DIRS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "directories=$DIRS" >> "$GITHUB_OUTPUT"

  audit-fix:
    needs: prepare
    strategy:
      matrix:
        directory: ${{ fromJson(needs.prepare.outputs.directories) }}
    uses: step-security/reusable-workflows/.github/workflows/audit_fix.yml@v1
    with:
      force: ${{ inputs.force || false }}
      base_branch: ${{ inputs.base_branch || 'main' }}
      node_version: ${{ inputs.node_version || '24' }}
      working_directory: ${{ matrix.directory }}
      script: ${{ inputs.script || 'npm run all' }}
